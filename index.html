<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GENERATIONAL RUN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#030508;--bg2:#080c14;--card:#0a0f1a;
            --border:rgba(59,130,246,0.1);--border-h:rgba(59,130,246,0.3);
            --t:#e2e8f0;--t2:#94a3b8;--t3:#475569;
            --b:#3b82f6;--bl:#60a5fa;--cy:#22d3ee;--cyg:rgba(34,211,238,0.08);
            --p:#8b5cf6;--r:#f43f5e;--o:#f59e0b;--pk:#ec4899;--g:#10b981;
            --glow:rgba(59,130,246,0.06);--neon:rgba(34,211,238,0.15);
        }
        body{
            font-family:'Inter',system-ui,sans-serif;
            background:var(--bg);color:var(--t);min-height:100vh;padding:16px 20px;overflow-x:hidden;
            background-image:
                linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
            background-size:60px 60px;
        }

        /* SCANLINE OVERLAY */
        body::before{
            content:'';position:fixed;top:0;left:0;width:100%;height:100%;
            background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);
            pointer-events:none;z-index:999;
        }
        /* AMBIENT GLOW */
        body::after{
            content:'';position:fixed;top:-30%;left:50%;transform:translateX(-50%);
            width:600px;height:600px;
            background:radial-gradient(circle,rgba(34,211,238,0.04) 0%,transparent 70%);
            pointer-events:none;z-index:0;
        }

        /* HEADER */
        .hd{text-align:center;padding:32px 0 28px;position:relative;z-index:1}
        .hd h1{
            font-family:'JetBrains Mono',monospace;
            font-size:2.2rem;font-weight:800;letter-spacing:6px;
            color:var(--cy);text-transform:uppercase;
            text-shadow:0 0 30px rgba(34,211,238,0.3),0 0 60px rgba(34,211,238,0.1);
        }
        .hd .dt{
            font-family:'JetBrains Mono',monospace;
            color:var(--t3);font-size:0.72rem;margin-top:10px;letter-spacing:1.5px;text-transform:uppercase;
        }
        .hd .sk{
            display:inline-flex;align-items:center;gap:7px;margin-top:14px;
            padding:5px 18px;
            background:linear-gradient(135deg,rgba(34,211,238,0.06),rgba(59,130,246,0.06));
            border:1px solid rgba(34,211,238,0.15);border-radius:4px;
            font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--cy);font-weight:600;letter-spacing:1px;
        }

        /* GRID */
        .g{max-width:1100px;margin:20px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:16px;position:relative;z-index:1}
        .g .fw{grid-column:1/-1}
        @media(max-width:768px){.g{grid-template-columns:1fr}.hd h1{font-size:1.6rem;letter-spacing:3px}body{padding:10px 12px}.stats{grid-template-columns:1fr 1fr 1fr !important}}

        /* CARD */
        .c{
            background:linear-gradient(135deg,var(--card),rgba(8,12,20,0.95));
            border:1px solid var(--border);border-radius:3px;padding:20px;
            position:relative;transition:border-color 0.3s;
        }
        .c:hover{border-color:var(--border-h)}
        /* Corner accents */
        .c::before,.c::after{
            content:'';position:absolute;width:12px;height:12px;
            border-color:rgba(34,211,238,0.2);border-style:solid;
            transition:border-color 0.3s;
        }
        .c::before{top:-1px;left:-1px;border-width:1px 0 0 1px}
        .c::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
        .c:hover::before,.c:hover::after{border-color:rgba(34,211,238,0.5)}

        .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
        .ct{
            font-family:'JetBrains Mono',monospace;
            font-size:0.65rem;text-transform:uppercase;letter-spacing:3px;color:var(--cy);font-weight:600;
            display:flex;align-items:center;gap:8px;
        }
        .ct::before{content:'//';color:rgba(34,211,238,0.3);font-weight:400}
        .ha{display:flex;gap:6px;align-items:center}

        /* STATS */
        .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
        .sb{
            background:var(--bg2);border:1px solid var(--border);border-radius:2px;padding:16px 12px;text-align:center;
            position:relative;overflow:hidden;transition:border-color 0.3s;
        }
        .sb:hover{border-color:rgba(34,211,238,0.2)}
        .sb::after{
            content:'';position:absolute;top:0;left:0;width:100%;height:1px;
            background:linear-gradient(90deg,transparent,rgba(34,211,238,0.3),transparent);
        }
        .sb .sl{
            font-family:'JetBrains Mono',monospace;
            font-size:0.55rem;text-transform:uppercase;letter-spacing:2.5px;color:var(--t3);margin-bottom:8px;
        }
        .sb .sv{
            font-family:'JetBrains Mono',monospace;
            font-size:1.4rem;font-weight:800;color:var(--cy);
            text-shadow:0 0 20px rgba(34,211,238,0.2);
        }

        /* INPUTS */
        input,select{
            padding:10px 14px;background:var(--bg);
            border:1px solid var(--border);border-radius:2px;
            color:var(--t);font-family:'JetBrains Mono',monospace;font-size:0.8rem;outline:none;
            transition:border-color 0.2s,box-shadow 0.2s;
        }
        input:focus,select:focus{border-color:var(--cy);box-shadow:0 0 8px rgba(34,211,238,0.1)}
        input::placeholder{color:var(--t3)}
        select option{background:var(--bg2)}
        input[type="time"]{color-scheme:dark;width:110px}

        /* COLLAPSE */
        .cf{max-height:0;overflow:hidden;opacity:0;transition:max-height 0.3s ease,opacity 0.2s ease,margin 0.3s ease;margin-top:0}
        .cf.open{max-height:120px;opacity:1;margin-top:14px}
        .fi{display:flex;gap:8px;padding-top:14px;border-top:1px solid rgba(34,211,238,0.08)}

        /* + BTN */
        .tb{
            width:28px;height:28px;border-radius:2px;
            background:rgba(34,211,238,0.06);border:1px solid rgba(34,211,238,0.15);
            color:var(--cy);font-size:1rem;cursor:pointer;
            display:flex;align-items:center;justify-content:center;
            transition:all 0.2s;padding:0;line-height:1;flex-shrink:0;
            font-family:'JetBrains Mono',monospace;
        }
        .tb:hover{background:rgba(34,211,238,0.12);border-color:var(--cy);box-shadow:0 0 12px rgba(34,211,238,0.15)}
        .tb.active{background:var(--cy);color:var(--bg);border-color:var(--cy);transform:rotate(45deg);box-shadow:0 0 16px rgba(34,211,238,0.3)}
        .tb.pp{background:rgba(139,92,246,0.06);border-color:rgba(139,92,246,0.15);color:#a78bfa}
        .tb.pp:hover{background:rgba(139,92,246,0.12);border-color:var(--p);box-shadow:0 0 12px rgba(139,92,246,0.15)}
        .tb.pp.active{background:var(--p);color:#fff;border-color:var(--p);box-shadow:0 0 16px rgba(139,92,246,0.3)}

        /* BUTTON */
        button{
            padding:10px 16px;background:rgba(34,211,238,0.1);color:var(--cy);
            border:1px solid rgba(34,211,238,0.2);border-radius:2px;
            font-family:'JetBrains Mono',monospace;font-weight:600;font-size:0.72rem;
            cursor:pointer;transition:all 0.15s;letter-spacing:1px;text-transform:uppercase;
        }
        button:hover{background:rgba(34,211,238,0.18);border-color:var(--cy);box-shadow:0 0 10px rgba(34,211,238,0.1)}
        button:active{transform:scale(0.97)}
        .sec{background:transparent;color:var(--t3);border:1px solid var(--border);font-size:0.65rem;padding:5px 10px}
        .sec:hover{color:var(--cy);border-color:rgba(34,211,238,0.2);box-shadow:none}
        .sm{padding:5px 10px;font-size:0.68rem}
        .dng{background:rgba(244,63,94,0.06);color:var(--r);border-color:rgba(244,63,94,0.15)}
        .dng:hover{background:rgba(244,63,94,0.12);border-color:var(--r)}
        .pbtn{background:rgba(139,92,246,0.1);color:#a78bfa;border-color:rgba(139,92,246,0.2)}
        .pbtn:hover{background:rgba(139,92,246,0.18);border-color:var(--p)}

        /* LOG */
        .le{margin-top:14px;max-height:180px;overflow-y:auto}
        .li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:2px;font-size:0.78rem;transition:background 0.15s;border-left:2px solid transparent}
        .li:hover{background:rgba(34,211,238,0.03);border-left-color:rgba(34,211,238,0.3)}
        .li .st{
            font-family:'JetBrains Mono',monospace;
            padding:2px 7px;border-radius:2px;font-size:0.58rem;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;flex-shrink:0;
        }
        .li .am{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--cy);flex-shrink:0;margin-left:auto;text-shadow:0 0 10px rgba(34,211,238,0.15)}
        .li .ld{font-family:'JetBrains Mono',monospace;color:var(--t3);font-size:0.62rem;flex-shrink:0;margin-left:8px;letter-spacing:0.5px}
        .li .dl{cursor:pointer;color:var(--t3);opacity:0;transition:opacity 0.15s;background:none;border:none;padding:2px;font-size:0.7rem;margin-left:6px}
        .li:hover .dl{opacity:0.6}
        .sf{background:rgba(16,185,129,0.08);color:#34d399}
        .sp{background:rgba(245,158,11,0.08);color:#fbbf24}
        .stw{background:rgba(59,130,246,0.08);color:#60a5fa}
        .sm2{background:rgba(139,92,246,0.08);color:#a78bfa}
        .so{background:rgba(100,116,139,0.08);color:#94a3b8}

        /* GOALS */
        .gl{margin-bottom:12px;padding:16px;background:var(--bg2);border:1px solid var(--border);border-radius:2px;transition:border-color 0.2s;position:relative}
        .gl:hover{border-color:var(--border-h)}
        .gl:last-child{margin-bottom:0}
        .gt{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
        .gn{font-weight:700;font-size:0.88rem;display:flex;align-items:center;gap:6px}
        .ga{font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--t3)}
        .ga span{color:var(--cy);font-weight:700}
        .pb{width:100%;height:6px;background:rgba(34,211,238,0.04);border-radius:1px;overflow:hidden;margin-bottom:8px;position:relative}
        .pb::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(90deg,transparent,transparent 4px,rgba(0,0,0,0.2) 4px,rgba(0,0,0,0.2) 5px)}
        .pf{height:100%;border-radius:1px;background:linear-gradient(90deg,var(--b),var(--cy));transition:width 0.5s ease;box-shadow:0 0 8px rgba(34,211,238,0.3)}
        .gb{display:flex;justify-content:space-between;align-items:center}
        .gp{font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--cy);font-weight:600}
        .gac{display:flex;gap:6px;align-items:center}
        .gac input{width:75px;padding:5px 8px;font-size:0.75rem}
        .gl.gpp{border-color:rgba(139,92,246,0.08)}.gl.gpp:hover{border-color:rgba(139,92,246,0.2)}.gl.gpp .pb{background:rgba(139,92,246,0.04)}.gl.gpp .pf{background:linear-gradient(90deg,var(--p),#a78bfa);box-shadow:0 0 8px rgba(139,92,246,0.3)}.gl.gpp .gp{color:#a78bfa}.gl.gpp .ga span{color:#a78bfa}
        .gl.gpk{border-color:rgba(236,72,153,0.08)}.gl.gpk:hover{border-color:rgba(236,72,153,0.2)}.gl.gpk .pb{background:rgba(236,72,153,0.04)}.gl.gpk .pf{background:linear-gradient(90deg,var(--pk),#f472b6);box-shadow:0 0 8px rgba(236,72,153,0.3)}.gl.gpk .gp{color:#f472b6}.gl.gpk .ga span{color:#f472b6}
        .gl.ggr{border-color:rgba(16,185,129,0.08)}.gl.ggr:hover{border-color:rgba(16,185,129,0.2)}.gl.ggr .pb{background:rgba(16,185,129,0.04)}.gl.ggr .pf{background:linear-gradient(90deg,var(--g),#34d399);box-shadow:0 0 8px rgba(16,185,129,0.3)}.gl.ggr .gp{color:#34d399}.gl.ggr .ga span{color:#34d399}
        .agf{max-height:0;overflow:hidden;opacity:0;transition:max-height 0.3s ease,opacity 0.2s ease,margin 0.3s ease;margin-top:0}
        .agf.show{max-height:120px;opacity:1;margin-top:14px}
        .agi{display:flex;gap:8px;flex-wrap:wrap;padding-top:14px;border-top:1px solid rgba(34,211,238,0.08)}

        /* DAILY */
        .ddt{
            font-family:'JetBrains Mono',monospace;
            font-size:0.6rem;padding:3px 10px;
            background:rgba(34,211,238,0.06);border:1px solid rgba(34,211,238,0.12);
            border-radius:2px;color:var(--cy);font-weight:600;letter-spacing:1px;
        }
        .dp{margin-bottom:14px}
        .dpt{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:0.65rem;margin-bottom:5px}
        .dpt .dc{color:var(--cy);font-weight:600}
        .dpt .dpc{color:var(--t3)}
        .db{height:4px;background:rgba(34,211,238,0.04);border-radius:1px;overflow:hidden}
        .dbf{height:100%;background:linear-gradient(90deg,var(--b),var(--cy));border-radius:1px;transition:width 0.3s ease;box-shadow:0 0 6px rgba(34,211,238,0.3)}

        /* TASKS */
        .tl{list-style:none}
        .ti{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:2px;margin-bottom:2px;transition:all 0.15s;border-left:2px solid transparent}
        .ti:hover{background:rgba(34,211,238,0.02);border-left-color:rgba(34,211,238,0.2)}
        .ti.done{opacity:0.25}
        .ti.done .tt{text-decoration:line-through}
        .tc{
            width:18px;height:18px;border-radius:2px;
            border:1.5px solid rgba(34,211,238,0.15);cursor:pointer;
            display:flex;align-items:center;justify-content:center;
            transition:all 0.15s;flex-shrink:0;background:transparent;color:transparent;
            font-size:0.6rem;font-weight:900;
        }
        .tc:hover{border-color:var(--cy);box-shadow:0 0 6px rgba(34,211,238,0.15)}
        .ti.done .tc{background:var(--cy);border-color:var(--cy);color:var(--bg);box-shadow:0 0 8px rgba(34,211,238,0.2)}
        .tt{flex:1;font-size:0.82rem}
        .tp{
            font-family:'JetBrains Mono',monospace;
            padding:2px 7px;border-radius:2px;font-size:0.55rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;flex-shrink:0;
        }
        .tp.high{background:rgba(244,63,94,0.08);color:var(--r)}
        .tp.med{background:rgba(245,158,11,0.08);color:var(--o)}
        .tp.low{background:rgba(139,92,246,0.08);color:var(--p)}
        .td{cursor:pointer;color:var(--t3);opacity:0;transition:opacity 0.15s;background:none;border:none;font-size:0.75rem;padding:2px 4px}
        .ti:hover .td{opacity:0.6}
        .tf{display:flex;gap:4px;margin-bottom:10px}
        .tfb{
            font-family:'JetBrains Mono',monospace;
            padding:4px 12px;border-radius:2px;font-size:0.62rem;cursor:pointer;
            background:transparent;border:1px solid var(--border);color:var(--t3);
            font-weight:500;transition:all 0.15s;letter-spacing:1px;text-transform:uppercase;
        }
        .tfb.active{background:rgba(34,211,238,0.06);border-color:rgba(34,211,238,0.2);color:var(--cy)}

        /* TIME BADGE */
        .tm{
            font-family:'JetBrains Mono',monospace;
            font-size:0.6rem;font-weight:600;padding:2px 6px;border-radius:2px;
            background:rgba(34,211,238,0.06);color:var(--cy);flex-shrink:0;white-space:nowrap;
        }
        .tm.od{background:rgba(244,63,94,0.08);color:var(--r);animation:po 2s ease-in-out infinite}
        .tm.sn{background:rgba(245,158,11,0.08);color:var(--o)}
        @keyframes po{0%,100%{opacity:1}50%{opacity:0.4}}

        /* EMPTY */
        .es{text-align:center;padding:20px;color:var(--t3);font-size:0.75rem;font-family:'JetBrains Mono',monospace;letter-spacing:0.5px}

        /* SCROLLBAR */
        ::-webkit-scrollbar{width:2px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(34,211,238,0.1);border-radius:2px}

        /* STATUS LINE */
        .status-line{
            max-width:1100px;margin:24px auto 0;padding:8px 14px;
            display:flex;justify-content:space-between;align-items:center;
            font-family:'JetBrains Mono',monospace;font-size:0.58rem;color:var(--t3);
            border-top:1px solid var(--border);letter-spacing:1px;
        }
        .status-dot{width:6px;height:6px;border-radius:50%;background:var(--cy);box-shadow:0 0 8px rgba(34,211,238,0.5);display:inline-block;margin-right:6px;animation:blink 2s ease-in-out infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
    </style>
</head>
<body>

<div class="hd">
    <h1>THE GENERATIONAL RUN</h1>
    <div class="dt" id="currentDate"></div>
    <div class="sk">🔥 <span id="streakCount">0</span> DAY STREAK</div>
</div>

<div class="g">

    <!-- MONEY -->
    <div class="c fw">
        <div class="ch">
            <div class="ct">Money Tracker</div>
            <div class="ha">
                <button class="sec" onclick="clearIncome()">CLR</button>
                <div class="tb" id="toggleIncome" onclick="toggleForm('income')">+</div>
            </div>
        </div>
        <div class="stats">
            <div class="sb"><div class="sl">Today</div><div class="sv" id="todayTotal">$0</div></div>
            <div class="sb"><div class="sl">This Week</div><div class="sv" id="weekTotal">$0</div></div>
            <div class="sb"><div class="sl">This Month</div><div class="sv" id="monthTotal">$0</div></div>
        </div>
        <div class="cf" id="incomeForm">
            <div class="fi">
                <input type="number" id="incomeAmount" placeholder="$0.00" step="0.01" min="0" style="width:100px" onkeydown="if(event.key==='Enter')logIncome()">
                <select id="incomeSource" style="flex:1">
                    <option value="flipgg">Flip.gg Dailys</option>
                    <option value="packdraw">Packdraw Dailys</option>
                    <option value="twitter">Twitter</option>
                    <option value="memecoins">Memecoins</option>
                    <option value="other">Other</option>
                </select>
                <button onclick="logIncome()">LOG</button>
            </div>
        </div>
        <div class="le" id="logEntries"></div>
    </div>

    <!-- DAILY -->
    <div class="c">
        <div class="ch">
            <div style="display:flex;align-items:center;gap:10px">
                <div class="ct">Daily</div>
                <div class="ddt" id="dailyDateTag"></div>
            </div>
            <div class="tb" id="toggleDaily" onclick="toggleForm('daily')">+</div>
        </div>
        <div class="dp">
            <div class="dpt"><span class="dc" id="dailyDoneCount">0/0</span><span class="dpc" id="dailyPct">0%</span></div>
            <div class="db"><div class="dbf" id="dailyBarFill" style="width:0%"></div></div>
        </div>
        <ul class="tl" id="dailyTaskList"></ul>
        <div class="cf" id="dailyForm">
            <div class="fi">
                <input type="text" id="dailyTaskInput" placeholder="task..." style="flex:1" onkeydown="if(event.key==='Enter'){addDailyTask();toggleForm('daily')}">
                <input type="time" id="dailyTaskTime">
                <button onclick="addDailyTask()">ADD</button>
            </div>
        </div>
    </div>

    <!-- GOALS -->
    <div class="c">
        <div class="ch">
            <div class="ct">Goals</div>
            <div class="tb" id="toggleGoal" onclick="toggleAddGoal()">+</div>
        </div>
        <div id="goalsContainer"></div>
        <div class="agf" id="addGoalForm">
            <div class="agi">
                <input type="text" id="newGoalEmoji" placeholder="🎯" style="width:48px;text-align:center">
                <input type="text" id="newGoalName" placeholder="goal name" style="flex:1;min-width:100px" onkeydown="if(event.key==='Enter')addGoal()">
                <input type="number" id="newGoalTarget" placeholder="target $" style="width:100px" onkeydown="if(event.key==='Enter')addGoal()">
                <select id="newGoalColor"><option value="blue">Blue</option><option value="purple">Purple</option><option value="pink">Pink</option><option value="green">Green</option></select>
                <button onclick="addGoal()">CREATE</button>
            </div>
        </div>
    </div>

    <!-- TASKS -->
    <div class="c fw">
        <div class="ch">
            <div class="ct">Tasks</div>
            <div class="ha">
                <button class="sec" onclick="clearDoneTasks()">CLR DONE</button>
                <div class="tb pp" id="toggleTask" onclick="toggleForm('task')">+</div>
            </div>
        </div>
        <div class="cf" id="taskForm">
            <div class="fi">
                <input type="text" id="taskInput" placeholder="what needs doing..." style="flex:1" onkeydown="if(event.key==='Enter')addTask()">
                <select id="taskPriority" style="width:90px"><option value="med">Med</option><option value="high">High</option><option value="low">Low</option></select>
                <button class="pbtn" onclick="addTask()">ADD</button>
            </div>
        </div>
        <div class="tf">
            <button class="tfb active" onclick="filterTasks('all',this)">ALL</button>
            <button class="tfb" onclick="filterTasks('active',this)">ACTIVE</button>
            <button class="tfb" onclick="filterTasks('done',this)">DONE</button>
        </div>
        <ul class="tl" id="taskList"></ul>
    </div>

</div>

<div class="status-line">
    <div><span class="status-dot"></span>SYSTEM ONLINE</div>
    <div id="nzTime"></div>
</div>

<script>
function getData(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}
function setData(k,v){localStorage.setItem(k,JSON.stringify(v))}

function toggleForm(n){
    const f=document.getElementById(n+'Form'),t=document.getElementById('toggle'+n.charAt(0).toUpperCase()+n.slice(1));
    const o=f.classList.contains('open');f.classList.toggle('open');t.classList.toggle('active');
    if(!o)setTimeout(()=>{const i=f.querySelector('input[type="text"],input[type="number"]');if(i)i.focus()},150);
}
function toggleAddGoal(){
    const f=document.getElementById('addGoalForm'),t=document.getElementById('toggleGoal');
    f.classList.toggle('show');t.classList.toggle('active');
    if(f.classList.contains('show'))setTimeout(()=>document.getElementById('newGoalName').focus(),150);
}

const TZ='Pacific/Auckland';
function nzNow(){
    const p=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date());
    const g=t=>p.find(x=>x.type===t).value;
    return{year:g('year'),month:g('month'),day:g('day'),hour:parseInt(g('hour')),minute:parseInt(g('minute')),second:parseInt(g('second'))};
}
function todayStr(){const n=nzNow();return`${n.year}-${n.month}-${n.day}`}
function getWeekStart(){const n=nzNow(),d=new Date(`${n.year}-${n.month}-${n.day}T12:00:00`),day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1);d.setDate(diff);return d.toISOString().split('T')[0]}
function getMonthStart(){const n=nzNow();return`${n.year}-${n.month}-01`}
function formatDate(s){if(s===todayStr())return'TODAY';const n=nzNow(),y=new Date(`${n.year}-${n.month}-${n.day}T12:00:00`);y.setDate(y.getDate()-1);if(s===y.toISOString().split('T')[0])return'YESTERDAY';const d=new Date(s+'T12:00:00');return d.toLocaleDateString('en-NZ',{day:'numeric',month:'short'}).toUpperCase()}
function nzMins(){const n=nzNow();return n.hour*60+n.minute}

// CLOCK
function updateClock(){
    const n=nzNow();
    document.getElementById('nzTime').textContent=`NZ ${String(n.hour).padStart(2,'0')}:${String(n.minute).padStart(2,'0')}:${String(n.second).padStart(2,'0')}`;
}
setInterval(updateClock,1000);

// STREAK
function updateStreak(){
    const logs=getData('income_logs',[]);let s=0,d=new Date();
    if(!logs.some(l=>l.date===todayStr()))d.setDate(d.getDate()-1);
    while(true){const ds=d.toISOString().split('T')[0];if(logs.some(l=>l.date===ds)){s++;d.setDate(d.getDate()-1)}else break}
    document.getElementById('streakCount').textContent=s;
}

// INCOME
function logIncome(){
    const a=parseFloat(document.getElementById('incomeAmount').value),s=document.getElementById('incomeSource').value;
    if(!a||a<=0)return;
    const logs=getData('income_logs',[]);
    logs.unshift({id:Date.now(),amount:a,source:s,date:todayStr()});
    setData('income_logs',logs);document.getElementById('incomeAmount').value='';
    renderIncome();updateStreak();
    if(document.getElementById('incomeForm').classList.contains('open'))toggleForm('income');
}
function deleteLog(id){setData('income_logs',getData('income_logs',[]).filter(l=>l.id!==id));renderIncome();updateStreak()}
function clearIncome(){if(!confirm('Clear all income logs?'))return;setData('income_logs',[]);renderIncome();updateStreak()}
function renderIncome(){
    const logs=getData('income_logs',[]),td=todayStr(),ws=getWeekStart(),ms=getMonthStart();
    const f=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
    document.getElementById('todayTotal').textContent=f(logs.filter(l=>l.date===td).reduce((s,l)=>s+l.amount,0));
    document.getElementById('weekTotal').textContent=f(logs.filter(l=>l.date>=ws).reduce((s,l)=>s+l.amount,0));
    document.getElementById('monthTotal').textContent=f(logs.filter(l=>l.date>=ms).reduce((s,l)=>s+l.amount,0));
    const c=document.getElementById('logEntries');
    if(!logs.length){c.innerHTML='';return}
    const sc={flipgg:'sf',packdraw:'sp',twitter:'stw',memecoins:'sm2',other:'so'};
    const sn={flipgg:'FLIP.GG',packdraw:'PACKDRAW',twitter:'TWITTER',memecoins:'MEMECOIN',other:'OTHER'};
    c.innerHTML=logs.slice(0,40).map(l=>`<div class="li"><span class="st ${sc[l.source]||'so'}">${sn[l.source]||l.source}</span><span class="ld">${formatDate(l.date)}</span><span class="am">+${f(l.amount)}</span><button class="dl" onclick="deleteLog(${l.id})">✕</button></div>`).join('');
}

// GOALS
const defaultGoals=[{id:1,emoji:'🏎️',name:'BMW G82 M4',target:120000,current:0,color:'blue'},{id:2,emoji:'❤️',name:"Mum's Credit Card Debt",target:10000,current:0,color:'pink'}];
function renderGoals(){
    const goals=getData('goals',defaultGoals),c=document.getElementById('goalsContainer');
    if(!goals.length){c.innerHTML='<div class="es">NO GOALS SET</div>';return}
    const cc={purple:'gpp',pink:'gpk',green:'ggr'};
    c.innerHTML=goals.map(g=>{
        const p=Math.min((g.current/g.target)*100,100);
        return`<div class="gl ${cc[g.color]||''}"><div class="gt"><div class="gn">${g.emoji} ${g.name}</div><div class="ga"><span>$${g.current.toLocaleString()}</span> / $${g.target.toLocaleString()}</div></div><div class="pb"><div class="pf" style="width:${p}%"></div></div><div class="gb"><div class="gp">${p.toFixed(1)}%</div><div class="gac"><input type="number" id="goalAdd_${g.id}" placeholder="$" step="0.01" onkeydown="if(event.key==='Enter')addToGoal(${g.id})"><button class="sm" onclick="addToGoal(${g.id})">+</button><button class="sm dng" onclick="removeGoal(${g.id})">✕</button></div></div></div>`;
    }).join('');
}
function addToGoal(id){const i=document.getElementById('goalAdd_'+id),a=parseFloat(i.value);if(!a||a<=0)return;const g=getData('goals',defaultGoals),gl=g.find(x=>x.id===id);if(gl){gl.current+=a;setData('goals',g)}i.value='';renderGoals()}
function removeGoal(id){if(!confirm('Remove goal?'))return;setData('goals',getData('goals',defaultGoals).filter(g=>g.id!==id));renderGoals()}
function addGoal(){
    const e=document.getElementById('newGoalEmoji').value||'🎯',n=document.getElementById('newGoalName').value.trim(),t=parseFloat(document.getElementById('newGoalTarget').value),cl=document.getElementById('newGoalColor').value;
    if(!n||!t)return;const g=getData('goals',defaultGoals);g.push({id:Date.now(),emoji:e,name:n,target:t,current:0,color:cl});setData('goals',g);
    document.getElementById('newGoalName').value='';document.getElementById('newGoalTarget').value='';document.getElementById('newGoalEmoji').value='';toggleAddGoal();renderGoals();
}

// DAILY
function getDailyKey(){return'daily_tasks_'+todayStr()}
function getDailyTasks(){return getData(getDailyKey(),[])}
function setDailyTasks(t){setData(getDailyKey(),t)}
function addDailyTask(){
    const i=document.getElementById('dailyTaskInput'),ti=document.getElementById('dailyTaskTime'),txt=i.value.trim(),due=ti.value||null;
    if(!txt)return;const t=getDailyTasks();t.push({id:Date.now(),text:txt,done:false,due});
    t.sort((a,b)=>{if(!a.due&&!b.due)return 0;if(!a.due)return 1;if(!b.due)return-1;return a.due.localeCompare(b.due)});
    setDailyTasks(t);i.value='';ti.value='';renderDailyTasks();
}
function toggleDailyTask(id){const t=getDailyTasks(),x=t.find(i=>i.id===id);if(x){x.done=!x.done;setDailyTasks(t)}renderDailyTasks()}
function deleteDailyTask(id){setDailyTasks(getDailyTasks().filter(t=>t.id!==id));renderDailyTasks()}
function renderDailyTasks(){
    const t=getDailyTasks(),total=t.length,done=t.filter(x=>x.done).length,pct=total?Math.round(done/total*100):0;
    document.getElementById('dailyDoneCount').textContent=`${done}/${total}`;
    document.getElementById('dailyPct').textContent=pct+'%';
    document.getElementById('dailyBarFill').style.width=pct+'%';
    document.getElementById('dailyDateTag').textContent=new Date().toLocaleDateString('en-NZ',{weekday:'short',day:'numeric',month:'short',timeZone:TZ}).toUpperCase();
    const list=document.getElementById('dailyTaskList');
    if(!t.length){list.innerHTML='<div class="es">HIT + TO PLAN YOUR DAY</div>';return}
    const nm=nzMins();
    list.innerHTML=t.map(x=>{
        let th='';
        if(x.due){const[h,m]=x.due.split(':').map(Number),dm=h*60+m,df=dm-nm;let cl='tm';
        if(!x.done&&df<0)cl+=' od';else if(!x.done&&df<=30&&df>=0)cl+=' sn';
        const hr=h%12||12,ap=h<12?'AM':'PM',ts=`${hr}:${String(m).padStart(2,'0')}${ap}`;
        th=`<span class="${cl}">${!x.done&&df<0?ts+' LATE':ts}</span>`}
        return`<li class="ti ${x.done?'done':''}"><div class="tc" onclick="toggleDailyTask(${x.id})">${x.done?'✓':''}</div><span class="tt">${x.text}</span>${th}<button class="td" onclick="deleteDailyTask(${x.id})">✕</button></li>`;
    }).join('');
}
setInterval(renderDailyTasks,60000);

// TASKS
let cf='all';
function addTask(){
    const i=document.getElementById('taskInput'),txt=i.value.trim(),pr=document.getElementById('taskPriority').value;
    if(!txt)return;const t=getData('tasks',[]);t.unshift({id:Date.now(),text:txt,priority:pr,done:false,created:todayStr()});
    setData('tasks',t);i.value='';renderTasks();
    if(document.getElementById('taskForm').classList.contains('open'))toggleForm('task');
}
function toggleTask(id){const t=getData('tasks',[]),x=t.find(i=>i.id===id);if(x){x.done=!x.done;setData('tasks',t)}renderTasks()}
function deleteTask(id){setData('tasks',getData('tasks',[]).filter(t=>t.id!==id));renderTasks()}
function clearDoneTasks(){setData('tasks',getData('tasks',[]).filter(t=>!t.done));renderTasks()}
function filterTasks(f,btn){cf=f;document.querySelectorAll('.tfb').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderTasks()}
function renderTasks(){
    let t=getData('tasks',[]);if(cf==='active')t=t.filter(x=>!x.done);else if(cf==='done')t=t.filter(x=>x.done);
    const list=document.getElementById('taskList');
    if(!t.length){list.innerHTML='<div class="es">'+(cf==='done'?'NO COMPLETED TASKS':'ALL CLEAR')+'</div>';return}
    list.innerHTML=t.map(x=>`<li class="ti ${x.done?'done':''}"><div class="tc" onclick="toggleTask(${x.id})">${x.done?'✓':''}</div><span class="tt">${x.text}</span><span class="tp ${x.priority}">${x.priority.toUpperCase()}</span><button class="td" onclick="deleteTask(${x.id})">✕</button></li>`).join('');
}

// INIT
(function(){
    document.getElementById('currentDate').textContent=new Date().toLocaleDateString('en-NZ',{weekday:'long',year:'numeric',month:'long',day:'numeric',timeZone:TZ}).toUpperCase();
    if(!localStorage.getItem('goals'))setData('goals',defaultGoals);
    renderIncome();renderGoals();renderDailyTasks();renderTasks();updateStreak();updateClock();
})();
</script>
</body>
</html>
