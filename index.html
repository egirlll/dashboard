<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOCK IN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #06080d;
            --bg2: #0b0f18;
            --card: rgba(14, 19, 30, 0.85);
            --card-border: rgba(56, 120, 255, 0.08);
            --card-border-hover: rgba(56, 120, 255, 0.18);
            --text: #e2e8f0;
            --text-dim: #64748b;
            --text-muted: #475569;
            --blue: #3b82f6;
            --blue-light: #60a5fa;
            --blue-glow: rgba(59, 130, 246, 0.12);
            --blue-glow2: rgba(59, 130, 246, 0.06);
            --cyan: #22d3ee;
            --purple: #8b5cf6;
            --purple-glow: rgba(139, 92, 246, 0.12);
            --red: #f43f5e;
            --orange: #f59e0b;
            --pink: #ec4899;
            --green: #10b981;
            --radius: 16px;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* AMBIENT BACKGROUND */
        body::before {
            content: '';
            position: fixed;
            top: -40%; left: -20%;
            width: 80%; height: 80%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%; right: -20%;
            width: 70%; height: 70%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.03) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* HEADER */
        .header {
            text-align: center;
            padding: 36px 0 32px;
            position: relative;
            z-index: 1;
        }
        .header h1 {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 8px;
            background: linear-gradient(135deg, var(--blue), var(--cyan), var(--blue-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }
        .header .date {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-top: 10px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        .header .streak-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
        }
        .header .streak {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 20px;
            background: var(--blue-glow);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 50px;
            font-size: 0.8rem;
            color: var(--blue-light);
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        /* QUOTE */
        .quote-bar {
            max-width: 1200px;
            margin: 0 auto 24px;
            text-align: center;
            padding: 16px 28px;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            font-style: italic;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 400;
            backdrop-filter: blur(20px);
            position: relative;
            z-index: 1;
        }

        /* GRID */
        .grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            position: relative;
            z-index: 1;
        }
        .grid .full { grid-column: 1 / -1; }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 2.2rem; letter-spacing: 5px; }
            body { padding: 12px; }
            .money-stats { grid-template-columns: repeat(2, 1fr) !important; }
            .log-row { flex-wrap: wrap; }
            .log-row input[type="number"], .log-row select { max-width: none; }
        }

        /* CARDS */
        .card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 24px;
            backdrop-filter: blur(20px);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            border-color: var(--card-border-hover);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.04);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: var(--text-dim);
            font-weight: 600;
        }

        /* MONEY STATS */
        .money-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .stat-box {
            background: linear-gradient(135deg, var(--blue-glow2), rgba(34, 211, 238, 0.03));
            border: 1px solid rgba(59, 130, 246, 0.1);
            border-radius: 14px;
            padding: 18px 16px;
            text-align: center;
            transition: border-color 0.3s, transform 0.2s;
        }
        .stat-box:hover {
            border-color: rgba(59, 130, 246, 0.25);
            transform: translateY(-2px);
        }
        .stat-box .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }
        .stat-box .value {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--blue), var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* INPUTS */
        input, select {
            padding: 12px 16px;
            background: var(--bg2);
            border: 1px solid rgba(56, 120, 255, 0.1);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        input::placeholder { color: var(--text-muted); }
        select option { background: var(--bg2); }

        /* COLLAPSIBLE FORMS */
        .collapse-form {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }
        .collapse-form.open {
            max-height: 200px;
            opacity: 1;
            margin-top: 16px;
        }
        .collapse-form .form-inner {
            display: flex;
            gap: 10px;
            padding-top: 16px;
            border-top: 1px solid var(--card-border);
        }

        /* + TOGGLE BUTTON */
        .add-toggle {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: var(--blue-glow);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: var(--blue-light);
            font-size: 1.1rem;
            font-weight: 400;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
            padding: 0;
            line-height: 1;
            flex-shrink: 0;
        }
        .add-toggle:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--blue);
            transform: scale(1.05);
            box-shadow: 0 0 16px rgba(59, 130, 246, 0.15);
        }
        .add-toggle.active {
            background: var(--blue);
            color: #fff;
            border-color: var(--blue);
            transform: rotate(45deg);
        }

        .add-toggle-purple {
            background: var(--purple-glow);
            border-color: rgba(139, 92, 246, 0.2);
            color: #a78bfa;
        }
        .add-toggle-purple:hover {
            background: rgba(139, 92, 246, 0.2);
            border-color: var(--purple);
            box-shadow: 0 0 16px rgba(139, 92, 246, 0.15);
        }
        .add-toggle-purple.active {
            background: var(--purple);
            color: #fff;
            border-color: var(--purple);
        }

        /* LOG ROW */
        .log-row {
            display: flex;
            gap: 10px;
        }
        .log-row input { flex: 1; }
        .log-row input[type="number"] { max-width: 130px; }
        .log-row select { max-width: 160px; }

        /* BUTTONS */
        button {
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--blue), #2563eb);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.83rem;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(59, 130, 246, 0.25); }
        button:active { transform: translateY(0); }
        button.secondary {
            background: rgba(59, 130, 246, 0.08);
            color: var(--text-dim);
            border: 1px solid rgba(59, 130, 246, 0.12);
        }
        button.secondary:hover { background: rgba(59, 130, 246, 0.14); color: var(--text); box-shadow: none; }
        button.small {
            padding: 7px 14px;
            font-size: 0.75rem;
            border-radius: 8px;
        }
        button.danger {
            background: rgba(244, 63, 94, 0.12);
            color: var(--red);
            border: 1px solid rgba(244, 63, 94, 0.15);
        }
        button.danger:hover { background: rgba(244, 63, 94, 0.2); box-shadow: none; }
        button.purple-btn {
            background: linear-gradient(135deg, var(--purple), #7c3aed);
        }

        /* INCOME LOG */
        .log-entries {
            margin-top: 16px;
            max-height: 220px;
            overflow-y: auto;
        }
        .log-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 14px;
            border-bottom: 1px solid rgba(56, 120, 255, 0.05);
            font-size: 0.85rem;
            transition: background 0.2s;
            border-radius: 8px;
        }
        .log-entry:hover { background: rgba(59, 130, 246, 0.04); }
        .log-entry .source-tag {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            flex-shrink: 0;
        }
        .log-entry .amount {
            font-weight: 700;
            color: var(--blue-light);
            flex-shrink: 0;
        }
        .log-entry .log-note {
            flex: 1;
            margin-left: 12px;
            color: var(--text-dim);
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .log-entry .log-date {
            color: var(--text-muted);
            font-size: 0.72rem;
            flex-shrink: 0;
            margin: 0 12px;
        }
        .log-entry .delete-log {
            cursor: pointer;
            color: var(--text-muted);
            opacity: 0;
            transition: opacity 0.2s;
            background: none;
            border: none;
            padding: 2px 6px;
            font-size: 0.8rem;
        }
        .log-entry:hover .delete-log { opacity: 1; }

        /* SOURCE COLORS */
        .src-youtube { background: rgba(239, 68, 68, 0.12); color: #f87171; }
        .src-trading { background: rgba(59, 130, 246, 0.12); color: #60a5fa; }
        .src-creator { background: rgba(236, 72, 153, 0.12); color: #f472b6; }
        .src-freelance { background: rgba(139, 92, 246, 0.12); color: #a78bfa; }
        .src-mowing { background: rgba(16, 185, 129, 0.12); color: #34d399; }
        .src-other { background: rgba(100, 116, 139, 0.12); color: #94a3b8; }

        /* GOALS */
        .goal {
            margin-bottom: 16px;
            padding: 18px;
            background: linear-gradient(135deg, var(--blue-glow2), transparent);
            border: 1px solid rgba(59, 130, 246, 0.06);
            border-radius: 14px;
            transition: border-color 0.3s;
        }
        .goal:hover { border-color: rgba(59, 130, 246, 0.15); }
        .goal:last-child { margin-bottom: 0; }
        .goal-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .goal-name {
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .goal-amounts {
            font-size: 0.82rem;
            color: var(--text-dim);
        }
        .goal-amounts span {
            color: var(--blue-light);
            font-weight: 700;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(59, 130, 246, 0.08);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .progress-fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--blue), var(--cyan));
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent 60%, rgba(255,255,255,0.15));
            border-radius: 10px;
        }
        .goal-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .goal-pct {
            font-size: 0.78rem;
            color: var(--blue-light);
            font-weight: 600;
        }
        .goal-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .goal-actions input {
            width: 100px;
            padding: 8px 12px;
            font-size: 0.82rem;
        }

        /* GOAL COLORS */
        .goal-purple { background: linear-gradient(135deg, var(--purple-glow), transparent); border-color: rgba(139, 92, 246, 0.06); }
        .goal-purple:hover { border-color: rgba(139, 92, 246, 0.15); }
        .goal-purple .progress-bar { background: rgba(139, 92, 246, 0.08); }
        .goal-purple .progress-fill { background: linear-gradient(90deg, var(--purple), #a78bfa); }
        .goal-purple .goal-pct { color: #a78bfa; }
        .goal-purple .goal-amounts span { color: #a78bfa; }

        .goal-pink { background: linear-gradient(135deg, rgba(236, 72, 153, 0.06), transparent); border-color: rgba(236, 72, 153, 0.06); }
        .goal-pink:hover { border-color: rgba(236, 72, 153, 0.15); }
        .goal-pink .progress-bar { background: rgba(236, 72, 153, 0.08); }
        .goal-pink .progress-fill { background: linear-gradient(90deg, var(--pink), #f472b6); }
        .goal-pink .goal-pct { color: #f472b6; }
        .goal-pink .goal-amounts span { color: #f472b6; }

        .goal-green { background: linear-gradient(135deg, rgba(16, 185, 129, 0.06), transparent); border-color: rgba(16, 185, 129, 0.06); }
        .goal-green:hover { border-color: rgba(16, 185, 129, 0.15); }
        .goal-green .progress-bar { background: rgba(16, 185, 129, 0.08); }
        .goal-green .progress-fill { background: linear-gradient(90deg, var(--green), #34d399); }
        .goal-green .goal-pct { color: #34d399; }
        .goal-green .goal-amounts span { color: #34d399; }

        /* ADD GOAL FORM */
        .add-goal-form {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease, margin 0.3s ease;
            margin-top: 0;
        }
        .add-goal-form.show {
            max-height: 200px;
            opacity: 1;
            margin-top: 16px;
        }
        .add-goal-inner {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding-top: 16px;
            border-top: 1px solid var(--card-border);
        }
        .add-goal-inner input, .add-goal-inner select { font-size: 0.85rem; }

        /* DAILY TASKS */
        .daily-date-tag {
            font-size: 0.7rem;
            padding: 4px 12px;
            background: var(--blue-glow);
            border: 1px solid rgba(59, 130, 246, 0.15);
            border-radius: 20px;
            color: var(--blue-light);
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .daily-progress {
            margin: 16px 0;
        }
        .daily-progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            margin-bottom: 6px;
        }
        .daily-progress-text .done-count { color: var(--blue-light); font-weight: 600; }
        .daily-progress-text .pct { color: var(--text-dim); }
        .daily-bar {
            height: 6px;
            background: rgba(59, 130, 246, 0.08);
            border-radius: 6px;
            overflow: hidden;
        }
        .daily-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--blue), var(--cyan));
            border-radius: 6px;
            transition: width 0.4s ease;
        }

        /* TASKS */
        .task-list { list-style: none; }
        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 4px;
            transition: all 0.2s;
        }
        .task-item:hover { background: rgba(59, 130, 246, 0.04); }
        .task-item.done { opacity: 0.35; }
        .task-item.done .task-text { text-decoration: line-through; }

        .task-check {
            width: 22px;
            height: 22px;
            border-radius: 7px;
            border: 2px solid rgba(59, 130, 246, 0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            background: transparent;
            color: transparent;
            font-size: 0.7rem;
            font-weight: 900;
        }
        .task-check:hover { border-color: var(--blue); }
        .task-item.done .task-check {
            background: linear-gradient(135deg, var(--blue), var(--cyan));
            border-color: var(--blue);
            color: #fff;
        }
        .task-text { flex: 1; font-size: 0.9rem; }
        .task-priority {
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.63rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            flex-shrink: 0;
        }
        .task-priority.high { background: rgba(244, 63, 94, 0.12); color: var(--red); }
        .task-priority.med { background: rgba(245, 158, 11, 0.12); color: var(--orange); }
        .task-priority.low { background: rgba(139, 92, 246, 0.12); color: var(--purple); }
        .task-delete {
            cursor: pointer;
            color: var(--text-muted);
            opacity: 0;
            transition: opacity 0.2s;
            background: none;
            border: none;
            font-size: 0.85rem;
            padding: 4px 8px;
        }
        .task-item:hover .task-delete { opacity: 1; }
        .task-filters {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }
        .task-filter {
            padding: 5px 14px;
            border-radius: 8px;
            font-size: 0.73rem;
            cursor: pointer;
            background: transparent;
            border: 1px solid rgba(59, 130, 246, 0.08);
            color: var(--text-dim);
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            transition: all 0.2s;
        }
        .task-filter.active {
            background: var(--blue-glow);
            border-color: rgba(59, 130, 246, 0.2);
            color: var(--blue-light);
        }
        .task-filter:hover:not(.active) { border-color: rgba(59, 130, 246, 0.15); }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 28px 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .empty-state .empty-icon {
            font-size: 2rem;
            margin-bottom: 8px;
            opacity: 0.5;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.15); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(59, 130, 246, 0.25); }

        /* HEADER ACTIONS */
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>LOCK IN</h1>
        <div class="date" id="currentDate"></div>
        <div class="streak-row">
            <div class="streak">🔥 <span id="streakCount">0</span> day streak</div>
        </div>
    </div>

    <div class="quote-bar" id="quoteBar"></div>

    <div class="grid">

        <!-- DAILY MONEY -->
        <div class="card full">
            <div class="card-header">
                <div class="card-title">💰 Money Tracker</div>
                <div class="header-actions">
                    <button class="small secondary" onclick="clearIncome()">Clear</button>
                    <div class="add-toggle" id="toggleIncome" onclick="toggleForm('income')" title="Log income">+</div>
                </div>
            </div>
            <div class="money-stats">
                <div class="stat-box">
                    <div class="label">Today</div>
                    <div class="value" id="todayTotal">$0</div>
                </div>
                <div class="stat-box">
                    <div class="label">This Week</div>
                    <div class="value" id="weekTotal">$0</div>
                </div>
                <div class="stat-box">
                    <div class="label">This Month</div>
                    <div class="value" id="monthTotal">$0</div>
                </div>
                <div class="stat-box">
                    <div class="label">All Time</div>
                    <div class="value" id="allTotal">$0</div>
                </div>
            </div>
            <div class="collapse-form" id="incomeForm">
                <div class="form-inner">
                    <input type="number" id="incomeAmount" placeholder="Amount ($)" step="0.01" min="0" style="max-width:130px;" onkeydown="if(event.key==='Enter')logIncome()">
                    <input type="text" id="incomeNote" placeholder="What for?" style="flex:1;" onkeydown="if(event.key==='Enter')logIncome()">
                    <select id="incomeSource" style="max-width:160px;">
                        <option value="trading">Trading</option>
                        <option value="youtube">YouTube</option>
                        <option value="creator">Creator Sites</option>
                        <option value="mowing">Mowing</option>
                        <option value="freelance">Freelance</option>
                        <option value="other">Other</option>
                    </select>
                    <button onclick="logIncome()">Log</button>
                </div>
            </div>
            <div class="log-entries" id="logEntries"></div>
        </div>

        <!-- DAILY TASKS -->
        <div class="card">
            <div class="card-header">
                <div style="display:flex;align-items:center;gap:12px;">
                    <div class="card-title">📋 Daily Tasks</div>
                    <div class="daily-date-tag" id="dailyDateTag"></div>
                </div>
                <div class="add-toggle" id="toggleDaily" onclick="toggleForm('daily')" title="Add daily task">+</div>
            </div>
            <div class="daily-progress">
                <div class="daily-progress-text">
                    <span class="done-count" id="dailyDoneCount">0 / 0 done</span>
                    <span class="pct" id="dailyPct">0%</span>
                </div>
                <div class="daily-bar"><div class="daily-bar-fill" id="dailyBarFill" style="width: 0%"></div></div>
            </div>
            <ul class="task-list" id="dailyTaskList"></ul>
            <div class="collapse-form" id="dailyForm">
                <div class="form-inner">
                    <input type="text" id="dailyTaskInput" placeholder="Add today's task..." style="flex:1;" onkeydown="if(event.key==='Enter'){addDailyTask();toggleForm('daily');}">
                    <button onclick="addDailyTask()">Add</button>
                </div>
            </div>
        </div>

        <!-- GOALS -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">🎯 Goals</div>
                <div class="add-toggle" id="toggleGoal" onclick="toggleAddGoal()" title="New goal">+</div>
            </div>
            <div id="goalsContainer"></div>
            <div class="add-goal-form" id="addGoalForm">
                <div class="add-goal-inner">
                    <input type="text" id="newGoalEmoji" placeholder="🎯" style="width: 56px; text-align: center;">
                    <input type="text" id="newGoalName" placeholder="Goal name" style="flex: 1; min-width: 120px;" onkeydown="if(event.key==='Enter')addGoal()">
                    <input type="number" id="newGoalTarget" placeholder="Target $" style="width: 110px;" onkeydown="if(event.key==='Enter')addGoal()">
                    <select id="newGoalColor">
                        <option value="blue">Blue</option>
                        <option value="purple">Purple</option>
                        <option value="pink">Pink</option>
                        <option value="green">Green</option>
                    </select>
                    <button onclick="addGoal()">Create</button>
                </div>
            </div>
        </div>

        <!-- TASKS -->
        <div class="card full">
            <div class="card-header">
                <div class="card-title">✅ Tasks</div>
                <div class="header-actions">
                    <button class="small secondary" onclick="clearDoneTasks()">Clear Done</button>
                    <div class="add-toggle add-toggle-purple" id="toggleTask" onclick="toggleForm('task')" title="Add task">+</div>
                </div>
            </div>
            <div class="collapse-form" id="taskForm">
                <div class="form-inner">
                    <input type="text" id="taskInput" placeholder="What needs to get done?" style="flex:1;" onkeydown="if(event.key==='Enter')addTask()">
                    <select id="taskPriority" style="width: 100px;">
                        <option value="med">Med</option>
                        <option value="high">High</option>
                        <option value="low">Low</option>
                    </select>
                    <button class="purple-btn" onclick="addTask()">Add</button>
                </div>
            </div>
            <div class="task-filters">
                <button class="task-filter active" data-filter="all" onclick="filterTasks('all', this)">All</button>
                <button class="task-filter" data-filter="active" onclick="filterTasks('active', this)">Active</button>
                <button class="task-filter" data-filter="done" onclick="filterTasks('done', this)">Done</button>
            </div>
            <ul class="task-list" id="taskList"></ul>
        </div>

    </div>

    <script>
        // ============ DATA ============
        function getData(key, fallback) {
            try { return JSON.parse(localStorage.getItem(key)) || fallback; }
            catch { return fallback; }
        }
        function setData(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

        // ============ TOGGLE FORMS ============
        function toggleForm(name) {
            const form = document.getElementById(name + 'Form');
            const toggle = document.getElementById('toggle' + name.charAt(0).toUpperCase() + name.slice(1));
            const isOpen = form.classList.contains('open');
            form.classList.toggle('open');
            toggle.classList.toggle('active');
            if (!isOpen) {
                setTimeout(() => {
                    const input = form.querySelector('input[type="text"], input[type="number"]');
                    if (input) input.focus();
                }, 200);
            }
        }

        function toggleAddGoal() {
            const form = document.getElementById('addGoalForm');
            const toggle = document.getElementById('toggleGoal');
            form.classList.toggle('show');
            toggle.classList.toggle('active');
            if (form.classList.contains('show')) {
                setTimeout(() => document.getElementById('newGoalName').focus(), 200);
            }
        }

        // ============ DATE ============
        function todayStr() { return new Date().toISOString().split('T')[0]; }
        function getWeekStart() {
            const d = new Date();
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            d.setDate(diff);
            return d.toISOString().split('T')[0];
        }
        function getMonthStart() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
        }
        function formatDate(dateStr) {
            if (dateStr === todayStr()) return 'Today';
            const y = new Date(); y.setDate(y.getDate()-1);
            if (dateStr === y.toISOString().split('T')[0]) return 'Yesterday';
            const d = new Date(dateStr + 'T12:00:00');
            return d.toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' });
        }

        // ============ QUOTES ============
        const quotes = [
            "The grind doesn't stop just because you're tired.",
            "Discipline is choosing between what you want now and what you want most.",
            "Lock in. Execute. Repeat.",
            "Small daily improvements over time lead to stunning results.",
            "You didn't come this far to only come this far.",
            "Outwork everyone. Quietly.",
            "The money you want is a reflection of the value you create.",
            "Stop planning. Start doing.",
            "Every dollar counts. Every day counts.",
            "Build in silence. Let the results be the noise.",
            "Comfort is the enemy of progress.",
            "You're one decision away from a completely different life.",
            "Stack skills. Stack money. Stay humble.",
            "The best time to start was yesterday. The second best time is now.",
            "Don't count the days. Make the days count.",
        ];

        // ============ STREAK ============
        function updateStreak() {
            const logs = getData('income_logs', []);
            let streak = 0;
            let checkDate = new Date();
            const hasToday = logs.some(l => l.date === todayStr());
            if (!hasToday) checkDate.setDate(checkDate.getDate() - 1);
            while (true) {
                const ds = checkDate.toISOString().split('T')[0];
                if (logs.some(l => l.date === ds)) { streak++; checkDate.setDate(checkDate.getDate() - 1); }
                else break;
            }
            document.getElementById('streakCount').textContent = streak;
        }

        // ============ INCOME ============
        function logIncome() {
            const amount = parseFloat(document.getElementById('incomeAmount').value);
            const note = document.getElementById('incomeNote').value.trim();
            const source = document.getElementById('incomeSource').value;
            if (!amount || amount <= 0) return;
            const logs = getData('income_logs', []);
            logs.unshift({ id: Date.now(), amount, note: note || source, source, date: todayStr(), timestamp: new Date().toISOString() });
            setData('income_logs', logs);
            document.getElementById('incomeAmount').value = '';
            document.getElementById('incomeNote').value = '';
            renderIncome();
            updateStreak();
            // Close the form after logging
            const form = document.getElementById('incomeForm');
            if (form.classList.contains('open')) toggleForm('income');
        }
        function deleteLog(id) {
            let logs = getData('income_logs', []);
            logs = logs.filter(l => l.id !== id);
            setData('income_logs', logs);
            renderIncome();
            updateStreak();
        }
        function clearIncome() {
            if (!confirm('Clear all income logs? This cannot be undone.')) return;
            setData('income_logs', []);
            renderIncome();
            updateStreak();
        }
        function renderIncome() {
            const logs = getData('income_logs', []);
            const today = todayStr(), weekStart = getWeekStart(), monthStart = getMonthStart();
            const fmt = n => '$' + n.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2});
            document.getElementById('todayTotal').textContent = fmt(logs.filter(l=>l.date===today).reduce((s,l)=>s+l.amount,0));
            document.getElementById('weekTotal').textContent = fmt(logs.filter(l=>l.date>=weekStart).reduce((s,l)=>s+l.amount,0));
            document.getElementById('monthTotal').textContent = fmt(logs.filter(l=>l.date>=monthStart).reduce((s,l)=>s+l.amount,0));
            document.getElementById('allTotal').textContent = fmt(logs.reduce((s,l)=>s+l.amount,0));
            const container = document.getElementById('logEntries');
            if (logs.length === 0) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = logs.slice(0, 50).map(l => `
                <div class="log-entry">
                    <span class="source-tag src-${l.source}">${l.source}</span>
                    <span class="log-note">${l.note}</span>
                    <span class="log-date">${formatDate(l.date)}</span>
                    <span class="amount">+${fmt(l.amount)}</span>
                    <button class="delete-log" onclick="deleteLog(${l.id})">✕</button>
                </div>
            `).join('');
        }

        // ============ GOALS ============
        const defaultGoals = [
            { id: 1, emoji: '🏎️', name: 'BMW G82 M4', target: 120000, current: 0, color: 'blue' },
            { id: 2, emoji: '❤️', name: "Mum's Credit Card Debt", target: 10000, current: 0, color: 'pink' },
        ];
        function renderGoals() {
            const goals = getData('goals', defaultGoals);
            const container = document.getElementById('goalsContainer');
            if (goals.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">🎯</div>No goals yet. Hit + to set your first target.</div>';
                return;
            }
            container.innerHTML = goals.map(g => {
                const pct = Math.min((g.current / g.target) * 100, 100);
                const colorClass = g.color !== 'blue' ? `goal-${g.color}` : '';
                return `
                    <div class="goal ${colorClass}">
                        <div class="goal-top">
                            <div class="goal-name">${g.emoji} ${g.name}</div>
                            <div class="goal-amounts"><span>$${g.current.toLocaleString()}</span> / $${g.target.toLocaleString()}</div>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${pct}%"></div></div>
                        <div class="goal-bottom">
                            <div class="goal-pct">${pct.toFixed(1)}%</div>
                            <div class="goal-actions">
                                <input type="number" id="goalAdd_${g.id}" placeholder="$" step="0.01" onkeydown="if(event.key==='Enter')addToGoal(${g.id})">
                                <button class="small" onclick="addToGoal(${g.id})">+</button>
                                <button class="small danger" onclick="removeGoal(${g.id})">✕</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        function addToGoal(id) {
            const input = document.getElementById('goalAdd_' + id);
            const amount = parseFloat(input.value);
            if (!amount || amount <= 0) return;
            const goals = getData('goals', defaultGoals);
            const goal = goals.find(g => g.id === id);
            if (goal) { goal.current += amount; setData('goals', goals); }
            input.value = '';
            renderGoals();
        }
        function removeGoal(id) {
            if (!confirm('Remove this goal?')) return;
            let goals = getData('goals', defaultGoals);
            goals = goals.filter(g => g.id !== id);
            setData('goals', goals);
            renderGoals();
        }
        function addGoal() {
            const emoji = document.getElementById('newGoalEmoji').value || '🎯';
            const name = document.getElementById('newGoalName').value.trim();
            const target = parseFloat(document.getElementById('newGoalTarget').value);
            const color = document.getElementById('newGoalColor').value;
            if (!name || !target) return;
            const goals = getData('goals', defaultGoals);
            goals.push({ id: Date.now(), emoji, name, target, current: 0, color });
            setData('goals', goals);
            document.getElementById('newGoalName').value = '';
            document.getElementById('newGoalTarget').value = '';
            document.getElementById('newGoalEmoji').value = '';
            toggleAddGoal();
            renderGoals();
        }

        // ============ DAILY TASKS ============
        function getDailyKey() { return 'daily_tasks_' + todayStr(); }
        function getDailyTasks() { return getData(getDailyKey(), []); }
        function setDailyTasks(tasks) { setData(getDailyKey(), tasks); }

        function addDailyTask() {
            const input = document.getElementById('dailyTaskInput');
            const text = input.value.trim();
            if (!text) return;
            const tasks = getDailyTasks();
            tasks.push({ id: Date.now(), text, done: false });
            setDailyTasks(tasks);
            input.value = '';
            renderDailyTasks();
        }
        function toggleDailyTask(id) {
            const tasks = getDailyTasks();
            const t = tasks.find(t => t.id === id);
            if (t) { t.done = !t.done; setDailyTasks(tasks); }
            renderDailyTasks();
        }
        function deleteDailyTask(id) {
            let tasks = getDailyTasks();
            tasks = tasks.filter(t => t.id !== id);
            setDailyTasks(tasks);
            renderDailyTasks();
        }
        function renderDailyTasks() {
            const tasks = getDailyTasks();
            const total = tasks.length;
            const done = tasks.filter(t => t.done).length;
            const pct = total > 0 ? Math.round((done / total) * 100) : 0;

            document.getElementById('dailyDoneCount').textContent = `${done} / ${total} done`;
            document.getElementById('dailyPct').textContent = pct + '%';
            document.getElementById('dailyBarFill').style.width = pct + '%';

            const now = new Date();
            document.getElementById('dailyDateTag').textContent = now.toLocaleDateString('en-NZ', { weekday: 'short', day: 'numeric', month: 'short' });

            const list = document.getElementById('dailyTaskList');
            if (tasks.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-icon">☀️</div>Hit + to plan your day.</div>';
                return;
            }
            list.innerHTML = tasks.map(t => `
                <li class="task-item ${t.done ? 'done' : ''}">
                    <div class="task-check" onclick="toggleDailyTask(${t.id})">${t.done ? '✓' : ''}</div>
                    <span class="task-text">${t.text}</span>
                    <button class="task-delete" onclick="deleteDailyTask(${t.id})">✕</button>
                </li>
            `).join('');
        }

        // ============ TASKS ============
        let currentFilter = 'all';
        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            const priority = document.getElementById('taskPriority').value;
            if (!text) return;
            const tasks = getData('tasks', []);
            tasks.unshift({ id: Date.now(), text, priority, done: false, created: todayStr() });
            setData('tasks', tasks);
            input.value = '';
            renderTasks();
            // Close the form after adding
            const form = document.getElementById('taskForm');
            if (form.classList.contains('open')) toggleForm('task');
        }
        function toggleTask(id) {
            const tasks = getData('tasks', []);
            const t = tasks.find(t => t.id === id);
            if (t) { t.done = !t.done; setData('tasks', tasks); }
            renderTasks();
        }
        function deleteTask(id) {
            let tasks = getData('tasks', []);
            tasks = tasks.filter(t => t.id !== id);
            setData('tasks', tasks);
            renderTasks();
        }
        function clearDoneTasks() {
            let tasks = getData('tasks', []);
            tasks = tasks.filter(t => !t.done);
            setData('tasks', tasks);
            renderTasks();
        }
        function filterTasks(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.task-filter').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTasks();
        }
        function renderTasks() {
            let tasks = getData('tasks', []);
            if (currentFilter === 'active') tasks = tasks.filter(t => !t.done);
            else if (currentFilter === 'done') tasks = tasks.filter(t => t.done);
            const list = document.getElementById('taskList');
            if (tasks.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-icon">✨</div>' + (currentFilter === 'done' ? 'No completed tasks' : 'All clear. Hit + to add something.') + '</div>';
                return;
            }
            list.innerHTML = tasks.map(t => `
                <li class="task-item ${t.done ? 'done' : ''}">
                    <div class="task-check" onclick="toggleTask(${t.id})">${t.done ? '✓' : ''}</div>
                    <span class="task-text">${t.text}</span>
                    <span class="task-priority ${t.priority}">${t.priority}</span>
                    <button class="task-delete" onclick="deleteTask(${t.id})">✕</button>
                </li>
            `).join('');
        }

        // ============ INIT ============
        function init() {
            const now = new Date();
            document.getElementById('currentDate').textContent = now.toLocaleDateString('en-NZ', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const dayIndex = Math.floor(now.getTime() / 86400000) % quotes.length;
            document.getElementById('quoteBar').textContent = `"${quotes[dayIndex]}"`;
            if (!localStorage.getItem('goals')) setData('goals', defaultGoals);
            renderIncome();
            renderGoals();
            renderDailyTasks();
            renderTasks();
            updateStreak();
        }
        init();
    </script>
</body>
</html>
